</style></head><body><main>
<div class="mast"><div class="identity"><span class="mark" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>AURELIAN INSTRUMENTS</div><div class="status" role="status"><i class="dot" id="dot"></i><span id="status">音源待機中</span></div></div>
<div class="title"><div class="headline"><h1>FM<span>–</span>6</h1><div class="descriptor">Phase Modulation<br>Synthesizer</div></div><div class="device">6 OPERATORS &nbsp;/&nbsp; 16 VOICES</div></div>
<div class="deck">
<div class="top-grid">
<section class="screen" aria-label="音色と演奏"><div class="screen-top"><span class="small">Voice memory</span><span class="patch-index" id="patchIndex"></span></div>
<div class="preset-select"><select id="preset" aria-label="プリセット音色"></select></div>
<div class="screen-foot"><button id="demo" class="play" aria-pressed="false">▶ フレーズ試奏</button><button id="stop">全音停止</button></div></section>
<section class="module"><div class="section-title"><h2>接続 <span class="small">Algorithm</span></h2><div class="algo" id="algorithms" aria-label="アルゴリズム"></div></div><div class="routing" id="routing" aria-label="オペレーター接続図。上から下へ変調"></div>
<div class="route-foot"><label for="feedback">OP6 Feedback</label><input type="range" id="feedback" min="0" max="1" step=".01"><output id="fbVal" for="feedback"></output><span class="out" id="carriers"></span></div></section>
</div>
<section class="module monitor" aria-labelledby="scope-heading">
<div class="monitor-head"><h2 id="scope-heading">波形モニター</h2><div class="monitor-tools"><span class="monitor-note" id="scope-note">表示音 —</span><span>横幅 12 ms</span><label>縦倍率<select id="scope-zoom"><option value="1">×1</option><option value="2">×2</option><option value="4">×4</option></select></label></div></div>
<div class="scope-grid" id="scope-grid"></div>
<p class="monitor-caption">OP1〜6 は最後に押した鍵の波形。最終出力には和音とリリース中の余韻も含まれます。</p>
</section>
<section class="module"><div class="editor-head"><h2>音色編集 <span class="role" id="role"></span></h2><div class="edit-tabs" id="operators" aria-label="編集するオペレーター"></div></div><div class="params" id="params"></div><p class="edit-foot" id="editHint"></p></section>
<section class="module"><div class="key-head"><h2>鍵盤 <span class="small">Keyboard</span></h2><div class="key-controls"><span>Oct</span><button id="octDown" aria-label="1オクターブ下げる">−</button><output id="octave"></output><button id="octUp" aria-label="1オクターブ上げる">＋</button><label for="gain" class="gain-control">音量</label><input type="range" id="gain" min="0" max="1" step=".01" value=".65"></div></div><div id="keys" class="keys" aria-label="演奏鍵盤"></div><div class="key-foot"><span>A〜K で演奏 ／ W・E・T・Y・U が黒鍵</span><span>Shift で強く弾く</span></div></section>
</div>
<div class="files"><button id="store">音色を書き出す ↓</button><button id="recall">音色を読み込む ↑</button><input id="file" type="file" accept=".json,application/json" hidden><span id="edition"></span></div><p class="error" role="alert" id="error"></p>
</main>
<script type="text/plain" id="processor">__WORKLET__</script>
<script>
"use strict";
const WASM="__WASM_BASE64__";
const BANK=__PATCHES__;
const $=id=>document.getElementById(id);
const clone=o=>JSON.parse(JSON.stringify(o));
const el=(s,t)=>{const n=document.createElement(s);n.textContent=t;return n};
const routes={1:[[2,1],[6,5,4,3]],5:[[2,1],[4,3],[6,5]],32:[[1],[2],[3],[4],[5],[6]]};
const controls=[
  ["Ratio","×",0.25,16,.001],["Level","",0,1,.01],["Attack","s",.002,4,.001],
  ["Decay","s",.01,5,.01],["Sustain","",0,1,.01],["Release","s",.01,4,.01]
];
const codes=["KeyA","KeyW","KeyS","KeyE","KeyD","KeyF","KeyT","KeyG","KeyY","KeyH","KeyU","KeyJ","KeyK"];
const names=["C","C♯","D","D♯","E","F","F♯","G","G♯","A","A♯","B","C"];
const blacks=new Map([[1,1],[3,2],[6,4],[8,5],[10,6]]);
let patch=clone(BANK[0]), selected=1, bankIndex=0, modified=false, octave=4;
let ctx, node, volumeParam, startup, moduleCache, nextId=1, epoch=0;
let demoTimers=[], demoActive=false;
const held=new Map();
const keyElements=[];
const paramElements=[];
function send(msg){if(node)node.port.postMessage(msg)}
function changed(){
  modified=true; send({type:"patch",patch});
  $("patchIndex").textContent="EDITED";
}
function displayValue(j,value){
  if(j===0) return Number(value.toFixed(3))+" ×";
  if(j===1||j===4) return Math.round(value*100)+" %";
  return value<.1 ? Math.round(value*1000)+" ms" : Number(value.toFixed(2))+" s";
}
function redrawEditor(){
  const stacks=routes[patch.algorithm], carriers=stacks.map(stack=>stack[stack.length-1]);
  const isCarrier=carriers.includes(selected+1);
  $("role").textContent="OP"+(selected+1)+" / "+(isCarrier?"キャリア":"モジュレーター");
  $("editHint").textContent=(isCarrier?"Level で、このオペレーターの音量が変わります。":"Level で、下につながるオペレーターの倍音が変わります。")+" 編集は次の打鍵から反映されます。";
  $("carriers").textContent="OUT · "+carriers.map(n=>"OP"+n).join(" + ");
  $("operators").replaceChildren();
  for(let i=0;i<6;i++){
    const b=el("button","OP"+(i+1));b.classList.toggle("selected",selected===i);b.setAttribute("aria-pressed",selected===i);
    b.onclick=()=>{selected=i;redrawEditor()};$("operators").append(b);
  }
  $("algorithms").replaceChildren();
  for(const num of [1,5,32]){
    const b=el("button",String(num).padStart(2,"0"));b.classList.toggle("selected",patch.algorithm===num);
    b.setAttribute("aria-label","アルゴリズム "+num);b.setAttribute("aria-pressed",num===patch.algorithm);
    b.onclick=()=>{patch.algorithm=num;changed();redrawEditor()};$("algorithms").append(b);
  }
  $("routing").replaceChildren();
  for(const stack of stacks){
    const column=el("div","");column.className="stack";
    for(const n of stack){
      const b=el("button",n);b.className="node"+(carriers.includes(n)?" car":"")+(n===6?" fb":"");
      b.setAttribute("aria-label","OP"+n+" を編集");b.setAttribute("aria-pressed",n===selected+1);
      b.onclick=()=>{selected=n-1;redrawEditor()};column.append(b);
      const bar=el("i","");bar.className="connector";column.append(bar);
    }
    $("routing").append(column);
  }
  paramElements.forEach(({range,out},j)=>{range.value=patch.operators[selected][j];out.value=displayValue(j,Number(range.value))});
  $("feedback").value=patch.feedback;$("fbVal").value=Math.round(patch.feedback*100)+"%";
}
controls.forEach(([label,unit,min,max,step],j)=>{
  const wrap=el("div","");wrap.className="param";const cap=el("label",label);cap.htmlFor="p"+j;
  const range=document.createElement("input");Object.assign(range,{type:"range",id:"p"+j,min,max,step});
  const out=document.createElement("output");out.setAttribute("for",range.id);
  range.oninput=()=>{patch.operators[selected][j]=+range.value;out.value=displayValue(j,+range.value);changed()};
  wrap.append(cap,out,range);$("params").append(wrap);paramElements.push({range,out});
});
$("feedback").oninput=e=>{patch.feedback=+e.target.value;$("fbVal").value=Math.round(patch.feedback*100)+"%";changed()};
BANK.forEach((p,i)=>{const o=el("option",p.name);o.value=i;$("preset").append(o)});
function loadPatch(p,i){
  patch=clone(p);bankIndex=i;modified=false;
  $("preset").value=String(i);$("patchIndex").textContent=i===-1?"USER":String(i+1).padStart(2,"0")+" / 04";
  send({type:"patch",patch});redrawEditor();
}
$("preset").onchange=e=>{const i=+e.target.value;loadPatch(i===-1?imported:BANK[i],i);e.target.blur()};
$("edition").textContent=WASM?"RUST / WEBASSEMBLY":"試奏版 / JAVASCRIPT";
function showError(e){$("error").textContent=e.message || String(e)}
async function prepare(){
  if(node){if(ctx.state!=="running") await ctx.resume();return}
  if(startup)return startup;
  startup=(async()=>{
    try {
      if(!window.AudioContext)throw Error("Web Audio 対応のPCブラウザーで開いてください。");
      ctx=new AudioContext({latencyHint:"interactive"});
      await ctx.resume();
      if(!ctx.audioWorklet)throw Error("ファイルで音源を起動できません。README の localhost での開き方をお試しください。");
      if(WASM && !moduleCache){
        const bytes=Uint8Array.from(atob(WASM),c=>c.charCodeAt(0));
        moduleCache=await WebAssembly.compile(bytes);
      }
      const blob=new Blob([$("processor").textContent],{type:"text/javascript"}),url=URL.createObjectURL(blob);
      try {await ctx.audioWorklet.addModule(url)} finally {URL.revokeObjectURL(url)}
      const processor=new AudioWorkletNode(ctx,"aurelian-fm6",{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[1],parameterData:{volume:+$("gain").value},processorOptions:{module:moduleCache,patch}});
      await new Promise((resolve,reject)=>{
        const deadline=setTimeout(()=>reject(Error("音源が応答しません。ページを開き直してお試しください。")),5000);
        processor.port.onmessage=e=>{if(e.data==="ready"){clearTimeout(deadline);resolve()}};
        processor.onprocessorerror=()=>{clearTimeout(deadline);reject(Error("音源の初期化に失敗しました。"))};
      });
      volumeParam=processor.parameters.get("volume");volumeParam.value=+$("gain").value;
      processor.port.onmessage=receiveScope;
      processor.connect(ctx.destination);node=processor;
      node.onprocessorerror=()=>{showError(Error("音源が停止しました。ページを開き直してください。"));$("status").textContent="音源停止";$("dot").classList.remove("on")};
      send({type:"patch",patch});$("dot").classList.add("on");$("status").textContent=Math.round(ctx.sampleRate/100)/10+" kHz · 演奏中";
      $("error").textContent="";
    } catch(e) {node=null;if(ctx && ctx.state!=="closed")await ctx.close();ctx=null;throw e}
  })();
  try {await startup} finally {startup=null}
}
$("gain").oninput=()=>{if(volumeParam)volumeParam.setTargetAtTime(+$("gain").value,ctx.currentTime,.012)};
function paintKeys(){const notes=new Set(Array.from(held.values(),v=>v.note));keyElements.forEach((b,i)=>b.classList.toggle("down",notes.has((octave+1)*12+i)))}
async function strike(token,note,velocity){
  if(held.has(token))return;
  const v={id:nextId++,note};held.set(token,v);paintKeys();
  try{await prepare();if(held.get(token)===v)send({type:"on",id:v.id,note,velocity})}
  catch(e){if(held.get(token)===v)held.delete(token);paintKeys();showError(e)}
}
function lift(token){
  const v=held.get(token);if(!v)return;
  send({type:"off",id:v.id});held.delete(token);paintKeys();
}
function finishDemo(){
  demoTimers.forEach(clearTimeout);demoTimers=[];demoActive=false;
  for(const key of Array.from(held.keys()))if(key.startsWith("demo:"))lift(key);
  $("demo").setAttribute("aria-pressed","false");$("demo").textContent="▶ フレーズ試奏";
}
function panic(){epoch++;finishDemo();held.clear();send({type:"silence"});paintKeys()}
$("stop").onclick=panic;
for(let i=0;i<codes.length;i++){
  const b=el("button",codes[i].slice(-1));b.className="piano";b.setAttribute("aria-label",names[i]+" ("+codes[i].slice(-1)+")");
  if(blacks.has(i)){b.classList.add("black");b.style.left="calc(3px + (100% - 6px) * "+blacks.get(i)/8+")"}
  else if(i===0||i===12)b.append(el("small","C"));
  b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);strike("ptr:"+e.pointerId,(octave+1)*12+i,e.shiftKey ? .98 : .72)};
  b.onpointerup=b.onpointercancel=b.onlostpointercapture=e=>lift("ptr:"+e.pointerId);
  b.onclick=e=>{if(e.detail===0){const token="access:"+i;strike(token,(octave+1)*12+i,.72);setTimeout(()=>lift(token),360)}};
  $("keys").append(b);keyElements.push(b);
}
function setOct(n){octave=Math.min(7,Math.max(1,n));$("octave").value="C"+octave;$("octDown").disabled=octave===1;$("octUp").disabled=octave===7;paintKeys()}
$("octDown").onclick=()=>setOct(octave-1);$("octUp").onclick=()=>setOct(octave+1);
window.addEventListener("keydown",e=>{
  if(e.code==="Escape"){panic();return}
  if(e.ctrlKey||e.metaKey||e.altKey||e.isComposing||e.target.tagName==="SELECT")return;
  const i=codes.indexOf(e.code);if(i<0)return;e.preventDefault();
  if(!e.repeat)strike(e.code,(octave+1)*12+i,e.shiftKey ? .98 : .72);
});
window.addEventListener("keyup",e=>lift(e.code));
window.addEventListener("blur",panic);
document.addEventListener("visibilitychange",()=>{if(document.hidden)panic()});
const phrase=[
  [0,60,.82,.72],[0,64,.82,.65],[0,67,.82,.65],[0,71,.82,.59],
  [1,74,.39,.83],[1.5,71,.38,.68],[2,67,.83,.73],
  [3,57,.86,.78],[3,60,.86,.65],[3,64,.86,.65],[3,67,.86,.59],
  [4,71,.4,.85],[4.5,69,.4,.67],[5,64,1.28,.76]
];
$("demo").onclick=async()=>{
  if(demoActive){epoch++;finishDemo();return}
  const token=++epoch;demoActive=true;$("demo").setAttribute("aria-pressed","true");$("demo").textContent="■ 試奏を停止";
  try {await prepare();if(token!==epoch)return;
    const beat=455;
    phrase.forEach(([start,note,duration,velocity],i)=>{
      const key="demo:"+i;
      demoTimers.push(setTimeout(()=>strike(key,note,velocity),start*beat),setTimeout(()=>lift(key),(start+duration)*beat));
    });
    demoTimers.push(setTimeout(finishDemo,6.35*beat));
  }catch(e){finishDemo();showError(e)}
};
let imported;
function validate(p){
  if(!p || typeof p.name!=="string" || !p.name.trim() || p.name.length>64 ||
    ![1,5,32].includes(p.algorithm) || !Number.isFinite(p.feedback) || p.feedback<0 || p.feedback>1 ||
    !Array.isArray(p.operators) || p.operators.length!==6 ||
    !p.operators.every(op=>Array.isArray(op)&&op.length===6&&op.every((v,j)=>Number.isFinite(v)&&v>=controls[j][2]&&v<=controls[j][3])))
    throw Error("FM–6 の音色ファイルを選んでください。");
}
$("store").onclick=()=>{
  const data=clone(patch);
  if(modified && !data.name.endsWith(" Edit"))data.name=data.name.slice(0,59)+" Edit";
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
  const a=el("a","");a.href=url;a.download=data.name.replace(/[^\p{L}\p{N}_-]+/gu,"-")+".fm6.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
$("recall").onclick=()=>$("file").click();
$("file").onchange=async e=>{
  try{const f=e.target.files[0];if(!f)return;if(f.size>32768)throw Error("音色ファイルが大きすぎます。");
    const p=JSON.parse(await f.text());validate(p);imported=p;
    let opt=$("preset").querySelector('option[value="-1"]');if(!opt){opt=el("option","");opt.value=-1;$("preset").append(opt)}opt.textContent=p.name;
    loadPatch(p,-1);$("error").textContent="";
  }catch(e){showError(e)}finally{$("file").value=""}
};
const traces=[];
for (let index=0; index<7; index++) {
  const master=index===6;
  const figure=el("figure","");figure.className=master?"trace master":"trace";
  const caption=el("figcaption",""),title=el("span",master?"最終出力":"OP "+(index+1));
  title.className="trace-name";
  const kind=el("span",master?"全ボイス・音量適用後":"");kind.className="trace-kind";
  const canvas=el("canvas","");canvas.setAttribute("role","img");
  canvas.setAttribute("aria-label",master?"全ボイスの最終出力波形":"OP"+(index+1)+" の出力波形");
  caption.append(title,kind);figure.append(caption,canvas);$("scope-grid").append(figure);
  traces.push({figure,kind,canvas,g:canvas.getContext("2d"),color:"#dbedaf"});
}
let displayFrame=null, spareBuffer=null, scopePending=false, lastDraw=-Infinity;
let labelAlgorithm=-1, lastNoteLabel="", scopeDirty=true;
function receiveScope(event) {
  const m=event.data;
  if(m.type!=="scope")return;
  // The previous frame stays readable while the next buffer is on the audio thread.
  if(displayFrame)spareBuffer=displayFrame.data.buffer;
  displayFrame={data:new Float32Array(m.buffer),note:m.note,algorithm:m.algorithm};
  scopePending=false;scopeDirty=true;
}
function updateScopeLabels(algorithm,note) {
  const sounding=algorithm!==0;
  const label=sounding?"表示音 "+names[note%12]+(Math.floor(note/12)-1):"表示音 —";
  if(label!==lastNoteLabel){$("scope-note").textContent=label;lastNoteLabel=label}
  const shown=sounding?algorithm:patch.algorithm;
  if(labelAlgorithm===shown)return;
  labelAlgorithm=shown;scopeDirty=true;
  const carriers=routes[shown].map(stack=>stack[stack.length-1]);
  for(let op=0;op<6;op++) {
    const carrier=carriers.includes(op+1),trace=traces[op];
    trace.kind.textContent=carrier?"キャリア":"モジュレーター";
    trace.figure.classList.toggle("modulator",!carrier);
    trace.color=carrier?"#cee79b":"#f1b486";
  }
  traces[6].color="#ffe6b1";
}
// Choose one rising zero crossing for all seven traces, so their relative
// phases and time positions remain comparable. A muted master uses an OP.
function trigger(data,visible) {
  if(!data)return 0;
  const limit=data.length/7-visible;
  let channel=6,largest=0;
  for(let op=6;op>=0;op--){
    let peak=0;
    for(let i=0;i<=limit;i++)peak=Math.max(peak,Math.abs(data[i*7+op]));
    if(peak>largest){largest=peak;channel=op}
    if(op===6 && peak>0.002)break;
  }
  for(let i=1;i<=limit;i++){
    if(data[(i-1)*7+channel]<=0 && data[i*7+channel]>0)return i;
  }
  return 0;
}
function paintTrace(trace,channel,data,start,count,zoom) {
  const {canvas,g}=trace;
  const dpr=Math.min(devicePixelRatio,2);
  const w=Math.max(1,Math.round(canvas.clientWidth*dpr)),h=Math.max(1,Math.round(canvas.clientHeight*dpr));
  if(canvas.width!==w)canvas.width=w;if(canvas.height!==h)canvas.height=h;
  g.clearRect(0,0,w,h);g.strokeStyle="#40594d";g.lineWidth=dpr*.65;g.beginPath();
  for(let k=1;k<6;k++){const x=w*k/6;g.moveTo(x,0);g.lineTo(x,h)}
  for(let k=1;k<4;k++){const y=h*k/4;g.moveTo(0,y);g.lineTo(w,y)}
  g.stroke();g.strokeStyle=trace.color;g.lineWidth=1.35*dpr;g.beginPath();
  if(!data){g.moveTo(0,h/2);g.lineTo(w,h/2)}
  else for(let i=0;i<count;i++){
    const value=data[(start+i)*7+channel];
    const x=w*i/(count-1),y=h*(.5-.48*value*zoom);
    if(i===0)g.moveTo(x,y);else g.lineTo(x,y);
  }
  g.stroke();
}
function draw(now=0) {
  const algorithm=displayFrame?.algorithm??0;
  updateScopeLabels(algorithm,displayFrame?.note??0);
  if(now-lastDraw>=1000/30){
    const visible=Math.max(2,Math.round((ctx?.sampleRate??48000)*.012));
    if(scopeDirty){
      const data=displayFrame?.data,start=trigger(data,visible),zoom=Number($("scope-zoom").value)||1;
      traces.forEach((trace,channel)=>paintTrace(trace,channel,data,start,visible,zoom));
      scopeDirty=false;
    }
    if(node && !scopePending && ctx.state==="running" && !document.hidden){
      const buffer=spareBuffer??new ArrayBuffer(visible*2*7*4);
      spareBuffer=null;scopePending=true;
      node.port.postMessage({type:"scope",buffer},[buffer]);
    }
    lastDraw=now;
  }
  requestAnimationFrame(draw);
}
$("scope-zoom").onchange=e=>{scopeDirty=true;e.target.blur()};
window.addEventListener("resize",()=>{scopeDirty=true});
setOct(4);loadPatch(BANK[0],0);draw();
</script></body></html>
