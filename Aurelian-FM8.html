<div class="title"><div class="headline"><h1>FM<span>–</span>8</h1><div class="descriptor">Phase Modulation<br>Synthesizer</div></div><div class="device">8 OPERATORS &nbsp;/&nbsp; 88 ALGORITHMS &nbsp;/&nbsp; 16 VOICES</div></div>

</div>

</section>
<section class="module"><div class="editor-head"><h2>音色編集 <span class="role" id="role"></span></h2><div class="edit-tabs" id="operators" aria-label="編集するオペレーター"></div></div><div class="params" id="params"></div><p class="edit-foot" id="editHint"></p></section>

</main>
<script type="text/plain" id="processor">// Reference engine used by the ready-to-play edition. The Rust edition routes
// the same messages into Wasm and does its entire sample loop in src/engine.rs.
// Shared by the page and the AudioWorklet. The builder fills ALGORITHMS from
// web/algorithms.txt, the same table src/algorithms.rs reads: line N is algorithm N.
const OPS = 8;
const ALGORITHMS = ["8>5>3>1 7>5 6>4>2>1","8>6>3>1 7>5>3 4>2>1","8>6>3>1 7>4>2>1 5>3","8>5>3>2 7>5 6>4>3 1","8>6>4>2 7>6 5>3>2 1","8>6>4>2 7>5>4 3>2 1","8>7>4>2 6>4 5>3>2 1","8>6>4>2 7>5>3>2 1","8>7>4>2 6>3>2 5>3 1","8>6>4>3 7>6 5>4 2>1","8>6>5>3 7>6 4>3 2>1","8>6>4>3 7>5>4 2>1","8>7>5>3 6>5 4>3 2>1","8>7>5>3 6>4>3 2>1","8>6>5>4 7>6 3>2>1","8>6>5>4 7>6 3>1 2>1","8>7>5>4 6>5 3>2>1","8>7>5>4 6>5 3>1 2>1","8>7>6>4 5>4 3>2>1","8>7>6>4 5>4 3>1 2>1","8>7>6>5 4>3>2>1","8>7>6>5 4>2>1 3>2","8>7>6>5 4>3>1 2>1","8>5>3 7>5 6>4>3 2>1","8>6>4 7>6 5>4 3>2>1","8>6>4 7>5>4 3>2>1","8>6>4 7>5>4 3>1 2>1","8>6>5 7>6 4>2>1 3>2","8>6>5 7>6 4>3>1 2>1","8>7>5 6>5 4>3>1 2>1","8>6>4>3 7>6 5>4 2 1","8>6>5>3 7>6 4>3 2 1","8>6>4>3 7>5>4 2 1","8>7>5>3 6>5 4>3 2 1","8>7>5>3 6>4>3 2 1","8>6>5>4 7>6 3>2 1","8>7>5>4 6>5 3>2 1","8>7>6>4 5>4 3>2 1","8>7>6>5 4>3>2 1","8>7>6>5 4>2 3>2 1","8>7>6>5 4>3 2>1","8>1 8>2 8>4 7>6>5>4 3>2","8>5>3 7>5 6>4>3 2 1","8>6>4 7>6 5>4 3>2 1","8>6>4 7>5>4 3>2 1","8>6>5 7>6 4>3>2 1","8>6>5 7>6 4>2 3>2 1","8>7>5 6>5 4>3>2 1","8>7>5 6>5 4>2 3>2 1","8>6>5 7>6 4>3 2>1","8>7>5 6>5 4>3 2>1","8>7>6 5>4>3 2>1","8>7>6 5>3 4>3 2>1","8>1 8>2 8>5 7>6>5 4>3>2","8>1 8>3 8>5 7>6>5 4>3 2>1","8>6 7>6 5>3 4>3 2>1","8>6>5>4 7>6 3 2 1","8>7>5>4 6>5 3 2 1","8>7>6>4 5>4 3 2 1","8>7>6>5 4>3 2 1","8>1 8>2 8>3 8>4 7>6>5>4","8>6>4 7>6 5>4 3 2 1","8>6>4 7>5>4 3 2 1","8>6>5 7>6 4>3 2 1","8>7>5 6>5 4>3 2 1","8>7>6 5>4>3 2 1","8>7>6 5>3 4>3 2 1","8>7>6 5>4 3>2 1","8>1 8>2 8>3 8>5 7>6>5 4>3","8>6 7>6 5>3 4>3 2 1","8>6 7>6 5>4 3>2 1","8>7 6>5 4>3 2>1","8>1 8>2 8>4 8>6 7>6 5>4 3>2","8>7>6>5 4 3 2 1","8>6>5 7>6 4 3 2 1","8>7>5 6>5 4 3 2 1","8>7>6 5>4 3 2 1","8>1 8>2 8>3 8>4 8>5 7>6>5","8>6 7>6 5>4 3 2 1","8>7 6>5 4>3 2 1","8>1 8>2 8>3 8>4 8>6 7>6 5>4","8>7>6 5 4 3 2 1","8>6 7>6 5 4 3 2 1","8>7 6>5 4 3 2 1","8>1 8>2 8>3 8>4 8>5 8>6 7>6","8>7 6 5 4 3 2 1","8>1 8>2 8>3 8>4 8>5 8>6 8>7","8 7 6 5 4 3 2 1"];
// "8>7>3 2 1": OP8 modulates OP7, OP7 modulates OP3. Operators that modulate nothing are carriers.
function parseAlgorithm(spec) {
  const modulators = Array.from({length:OPS}, () => []);
  for (const chain of spec.trim().split(/\s+/)) {
    const ops = chain.split(">").map(n => Number(n) - 1);
    for (let k = 1; k < ops.length; k++) {
      if (!modulators[ops[k]].includes(ops[k-1])) modulators[ops[k]].push(ops[k-1]);
    }
  }
  const sources = new Set(modulators.flat());
  return {modulators, carriers:[...Array(OPS).keys()].filter(i => !sources.has(i))};
}
const ROUTES = ALGORITHMS.map(parseAlgorithm);
function route(algorithm) { return ROUTES[Math.min(ALGORITHMS.length, Math.max(1, algorithm)) - 1]; }

// FM–6 files had six operators and algorithms 1, 5 and 32. Each maps onto an
// FM–8 algorithm that contains the same wiring, with OP6 (feedback) moved to OP8.
// The two unused operators are silent, so the sound stays the same.
const LEGACY = {1:[10,[0,1,2,3,5,7]], 5:[72,[0,1,2,3,6,7]], 32:[88,[0,1,2,3,4,7]]};
const SILENT_OPERATOR = [1,0,0.006,0.3,1,0.15];
function upgradePatch(p) {
  if (!p || !Array.isArray(p.operators) || p.operators.length !== 6 || !LEGACY[p.algorithm]) return p;
  const [algorithm, places] = LEGACY[p.algorithm];
  const operators = Array.from({length:OPS}, () => SILENT_OPERATOR.slice());
  p.operators.forEach((op, i) => { operators[places[i]] = op; });
  return {...p, algorithm, operators};
}

const tau = 2 * Math.PI;
const sine = Float32Array.from({length:2049}, (_, i) => Math.sin(tau * i / 2048));

class PreviewEngine {
  constructor(rate) {
    this.rate = rate;
    this.slots = Array(16).fill(null);
    this.serial = 0;
    this.taps = new Float32Array(128 * OPS);
  }
  setPatch(patch) { this.patch = patch; }
  on(id, note, velocity) {
    if (velocity <= 0) { this.off(id); return; }
    let i = this.slots.findIndex(v => v && v.id === id);
    if (i < 0) i = this.slots.indexOf(null);
    if (i < 0) {
      i = 0;
      for (let k = 1; k < 16; k++) {
        const v = this.slots[k], old = this.slots[i];
        if ((v.released && !old.released) || (v.released === old.released && v.serial < old.serial)) i = k;
      }
    }
    const hz = 440 * 2 ** ((note - 69) / 12);
    const {feedback, operators} = this.patch;
    const algorithm = Math.min(ALGORITHMS.length, Math.max(1, this.patch.algorithm));
    this.slots[i] = {
      id, note, algorithm, serial: ++this.serial, released:false, velocity, feedback, route:route(algorithm),
      recent:0, older:0, values:new Float64Array(OPS),
      ops:operators.map(([ratio, level, a, d, s, r]) => ({
        p:0, step:(hz * ratio / this.rate) % 1, level, env:0, stage:0,
        attack:1 / Math.max(1, a * this.rate), decay:(1-s) / Math.max(1, d * this.rate),
        sustain:s, releaseSamples:Math.max(1, r * this.rate), release:0
      }))
    };
  }
  off(id) {
    for (const v of this.slots) {
      if (!v || v.id !== id || v.released) continue;
      v.released = true;
      for (const op of v.ops) { op.stage=3; op.release=op.env / op.releaseSamples; }
    }
  }
  silence() { this.slots.fill(null); }
  render(out, monitor) {
    out.fill(0);
    let focus = null;
    if (monitor) {

  const lift=i=>level[i]??=(targets[i].length?Math.max(...targets[i].map(t=>lift(t)+1)):0);
  for(let i=0;i<OPS;i++)lift(i);
  const shared=new Set([...Array(OPS).keys()].filter(i=>targets[i].length>1));
  const top=Math.max(...level.filter((_,i)=>!shared.has(i)));
  for(const i of shared)level[i]=top+1;
  const x=Array(OPS);let columns=0;
  const place=i=>{
    const upper=r.modulators[i].filter(j=>!shared.has(j)).sort((a,b)=>a-b);
    if(!upper.length){x[i]=columns++;return}
    upper.forEach(place);x[i]=upper.reduce((sum,j)=>sum+x[j],0)/upper.length;
  };
  r.carriers.forEach(place);
  for(const i of shared)x[i]=targets[i].reduce((sum,t)=>sum+x[t],0)/targets[i].length;

function drawRouting(r){
  const {x,level,targets,columns,rows}=layoutRoute(r),rowH=29,height=rows*rowH+12;
  const box=$("routing");box.replaceChildren();box.style.height=height+"px";
  // Pixel coordinates keep every line crisp. The diagram is redrawn when the window resizes.
  const width=box.clientWidth||400,column=width/columns;
  const X=i=>Math.round((x[i]+.5)*column)+.5,Y=i=>(rows-1-level[i])*rowH+rowH/2+.5,bus=height-2.5;
  const svg=document.createElementNS("http://www.w3.org/2000/svg","svg");
  svg.setAttribute("viewBox","0 0 "+width+" "+height);svg.setAttribute("aria-hidden","true");
  const line=(d,cls)=>{const p=document.createElementNS(svg.namespaceURI,"path");p.setAttribute("d",d);if(cls)p.setAttribute("class",cls);svg.append(p)};
  targets.forEach((list,a)=>list.forEach(t=>{
    const mid=Y(a)+rowH/2;
    // Drop beside the target's column when another operator stands in the way.
    const blocked=x.some((xk,k)=>k!==a&&k!==t&&xk===x[t]&&level[k]>level[t]&&level[k]<level[a]);
    line(blocked?`M${X(a)} ${Y(a)}V${mid}H${Math.round(X(t)+column/2)}V${Y(t)}H${X(t)}`:`M${X(a)} ${Y(a)}V${mid}H${X(t)}V${Y(t)}`);
  }));
  const outs=r.carriers.map(X);
  outs.forEach((cx,k)=>line(`M${cx} ${Y(r.carriers[k])}V${bus}`));
  line(`M${Math.min(...outs)-column*.35} ${bus}H${Math.max(...outs)+column*.35}`,"bus");
  box.append(svg);
  for(let i=0;i<OPS;i++){
    const b=el("button",i+1);b.className="node"+(r.carriers.includes(i)?" car":"")+(i===OPS-1?" fb":"");
    b.style.left=X(i)+"px";b.style.top=Y(i)+"px";
    b.setAttribute("aria-label","OP"+(i+1)+" を編集");b.setAttribute("aria-pressed",i===selected);

  }
}
function setAlgorithm(n){

  patch.algorithm=n;changed();redrawEditor();
}
ALGORITHMS.forEach((_,k)=>{const o=el("option",String(k+1).padStart(2,"0")+" · 出力"+ROUTES[k].carriers.length);o.value=k+1;$("algorithm").append(o)});

$("algoNext").onclick=()=>setAlgorithm(patch.algorithm+1);

  $("editHint").textContent=(isCarrier?"Level で、このオペレーターの音量が変わります。":"Level で、下につながるオペレーターの倍音が変わります。")+" 編集は次の打鍵から反映されます。";

}
controls.forEach(([label,unit,min,max,step],j)=>{
  const wrap=el("div","");wrap.className="param";const cap=el("label",label);cap.htmlFor="p"+j;
  const range=document.createElement("input");Object.assign(range,{type:"range",id:"p"+j,min,max,step});
  const out=document.createElement("output");out.setAttribute("for",range.id);
  range.oninput=()=>{patch.operators[selected][j]=+range.value;out.value=displayValue(j,+range.value);changed()};
  wrap.append(cap,out,range);$("params").append(wrap);paramElements.push({range,out});
});
$("feedback").oninput=e=>{patch.feedback=+e.target.value;$("fbVal").value=Math.round(patch.feedback*100)+"%";changed()};
BANK.forEach((p,i)=>{const o=el("option",p.name);o.value=i;$("preset").append(o)});
function loadPatch(p,i){
  patch=clone(p);bankIndex=i;modified=false;
  $("preset").value=String(i);$("patchIndex").textContent=i===-1?"USER":String(i+1).padStart(2,"0")+" / "+String(BANK.length).padStart(2,"0");
  send({type:"patch",patch});redrawEditor();
}
$("preset").onchange=e=>{const i=+e.target.value;loadPatch(i===-1?imported:BANK[i],i);e.target.blur()};
$("edition").textContent=WASM?"RUST / WEBASSEMBLY":"試奏版 / JAVASCRIPT";
function showError(e){$("error").textContent=e.message || String(e)}
async function prepare(){
  if(node){if(ctx.state!=="running") await ctx.resume();return}
  if(startup)return startup;
  startup=(async()=>{
    try {
      if(!window.AudioContext)throw Error("Web Audio 対応のPCブラウザーで開いてください。");
      ctx=new AudioContext({latencyHint:"interactive"});
      await ctx.resume();
      if(!ctx.audioWorklet)throw Error("ファイルで音源を起動できません。README の localhost での開き方をお試しください。");
      if(WASM && !moduleCache){
        const bytes=Uint8Array.from(atob(WASM),c=>c.charCodeAt(0));
        moduleCache=await WebAssembly.compile(bytes);
      }
      // file:// で開くとオリジンが null になり、blob:null の URL は Worklet に拒否されるため data: URL で渡す
      await ctx.audioWorklet.addModule("data:text/javascript;charset=utf-8,"+encodeURIComponent($("processor").textContent));
      const processor=new AudioWorkletNode(ctx,"aurelian-fm8",{numberOfInputs:0,numberOfOutputs:1,outputChannelCount:[1],parameterData:{volume:+$("gain").value},processorOptions:{module:moduleCache,patch}});
      await new Promise((resolve,reject)=>{
        const deadline=setTimeout(()=>reject(Error("音源が応答しません。ページを開き直してお試しください。")),5000);
        processor.port.onmessage=e=>{if(e.data==="ready"){clearTimeout(deadline);resolve()}};
        processor.onprocessorerror=()=>{clearTimeout(deadline);reject(Error("音源の初期化に失敗しました。"))};
      });
      volumeParam=processor.parameters.get("volume");volumeParam.value=+$("gain").value;
      processor.port.onmessage=receiveScope;
      processor.connect(ctx.destination);node=processor;
      node.onprocessorerror=()=>{showError(Error("音源が停止しました。ページを開き直してください。"));$("status").textContent="音源停止";$("dot").classList.remove("on")};
      send({type:"patch",patch});$("dot").classList.add("on");$("status").textContent=Math.round(ctx.sampleRate/100)/10+" kHz · 演奏中";
      $("error").textContent="";
    } catch(e) {node=null;if(ctx && ctx.state!=="closed")await ctx.close();ctx=null;throw e}
  })();
  try {await startup} finally {startup=null}
}
$("gain").oninput=()=>{if(volumeParam)volumeParam.setTargetAtTime(+$("gain").value,ctx.currentTime,.012)};
function paintKeys(){const notes=new Set(Array.from(held.values(),v=>v.note));keyElements.forEach((b,i)=>b.classList.toggle("down",notes.has((octave+1)*12+i)))}
async function strike(token,note,velocity){
  if(held.has(token))return;
  const v={id:nextId++,note};held.set(token,v);paintKeys();
  try{await prepare();if(held.get(token)===v)send({type:"on",id:v.id,note,velocity})}
  catch(e){if(held.get(token)===v)held.delete(token);paintKeys();showError(e)}
}
function lift(token){
  const v=held.get(token);if(!v)return;
  send({type:"off",id:v.id});held.delete(token);paintKeys();
}
function finishDemo(){
  demoTimers.forEach(clearTimeout);demoTimers=[];demoActive=false;
  for(const key of Array.from(held.keys()))if(key.startsWith("demo:"))lift(key);
  $("demo").setAttribute("aria-pressed","false");$("demo").textContent="▶ フレーズ試奏";
}
function panic(){epoch++;finishDemo();held.clear();send({type:"silence"});paintKeys()}
$("stop").onclick=panic;
for(let i=0;i<codes.length;i++){
  const b=el("button",codes[i].slice(-1));b.className="piano";b.setAttribute("aria-label",names[i]+" ("+codes[i].slice(-1)+")");
  if(blacks.has(i)){b.classList.add("black");b.style.left="calc(3px + (100% - 6px) * "+blacks.get(i)/8+")"}
  else if(i===0||i===12)b.append(el("small","C"));
  b.onpointerdown=e=>{e.preventDefault();b.setPointerCapture(e.pointerId);strike("ptr:"+e.pointerId,(octave+1)*12+i,e.shiftKey ? .98 : .72)};
  b.onpointerup=b.onpointercancel=b.onlostpointercapture=e=>lift("ptr:"+e.pointerId);
  b.onclick=e=>{if(e.detail===0){const token="access:"+i;strike(token,(octave+1)*12+i,.72);setTimeout(()=>lift(token),360)}};
  $("keys").append(b);keyElements.push(b);
}
function setOct(n){octave=Math.min(7,Math.max(1,n));$("octave").value="C"+octave;$("octDown").disabled=octave===1;$("octUp").disabled=octave===7;paintKeys()}
$("octDown").onclick=()=>setOct(octave-1);$("octUp").onclick=()=>setOct(octave+1);
window.addEventListener("keydown",e=>{

  if(!e.repeat)strike(e.code,(octave+1)*12+i,e.shiftKey ? .98 : .72);
});
window.addEventListener("keyup",e=>lift(e.code));
window.addEventListener("blur",panic);
document.addEventListener("visibilitychange",()=>{if(document.hidden)panic()});
const phrase=[
  [0,60,.82,.72],[0,64,.82,.65],[0,67,.82,.65],[0,71,.82,.59],
  [1,74,.39,.83],[1.5,71,.38,.68],[2,67,.83,.73],
  [3,57,.86,.78],[3,60,.86,.65],[3,64,.86,.65],[3,67,.86,.59],
  [4,71,.4,.85],[4.5,69,.4,.67],[5,64,1.28,.76]
];
$("demo").onclick=async()=>{
  if(demoActive){epoch++;finishDemo();return}
  const token=++epoch;demoActive=true;$("demo").setAttribute("aria-pressed","true");$("demo").textContent="■ 試奏を停止";
  try {await prepare();if(token!==epoch)return;
    const beat=455;
    phrase.forEach(([start,note,duration,velocity],i)=>{
      const key="demo:"+i;
      demoTimers.push(setTimeout(()=>strike(key,note,velocity),start*beat),setTimeout(()=>lift(key),(start+duration)*beat));
    });
    demoTimers.push(setTimeout(finishDemo,6.35*beat));
  }catch(e){finishDemo();showError(e)}
};
let imported;
function validate(p){
  if(!p || typeof p.name!=="string" || !p.name.trim() || p.name.length>64 ||
    !Number.isInteger(p.algorithm) || p.algorithm<1 || p.algorithm>ALGORITHMS.length ||
    !Number.isFinite(p.feedback) || p.feedback<0 || p.feedback>1 ||
    !Array.isArray(p.operators) || p.operators.length!==OPS ||
    !p.operators.every(op=>Array.isArray(op)&&op.length===6&&op.every((v,j)=>Number.isFinite(v)&&v>=controls[j][2]&&v<=controls[j][3])))
    throw Error("FM–8 または FM–6 の音色ファイルを選んでください。");
}
$("store").onclick=()=>{
  const data=clone(patch);
  if(modified && !data.name.endsWith(" Edit"))data.name=data.name.slice(0,59)+" Edit";
  const url=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"}));
  const a=el("a","");a.href=url;a.download=data.name.replace(/[^\p{L}\p{N}_-]+/gu,"-")+".fm8.json";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
$("recall").onclick=()=>$("file").click();
$("file").onchange=async e=>{
  try{const f=e.target.files[0];if(!f)return;if(f.size>32768)throw Error("音色ファイルが大きすぎます。");
    const p=upgradePatch(JSON.parse(await f.text()));validate(p);imported=p;
    let opt=$("preset").querySelector('option[value="-1"]');if(!opt){opt=el("option","");opt.value=-1;$("preset").append(opt)}opt.textContent=p.name;
    loadPatch(p,-1);$("error").textContent="";
  }catch(e){showError(e)}finally{$("file").value=""}
};
const traces=[];
for (let index=0; index<=OPS; index++) {
  const master=index===OPS;
  const figure=el("figure","");figure.className=master?"trace master":"trace";
  const caption=el("figcaption",""),title=el("span",master?"最終出力":"OP "+(index+1));
  title.className="trace-name";
  const kind=el("span",master?"全ボイス・音量適用後":"");kind.className="trace-kind";
  const canvas=el("canvas","");canvas.setAttribute("role","img");
  canvas.setAttribute("aria-label",master?"全ボイスの最終出力波形":"OP"+(index+1)+" の出力波形");
  caption.append(title,kind);figure.append(caption,canvas);$("scope-grid").append(figure);
  traces.push({figure,kind,canvas,g:canvas.getContext("2d"),color:"#dbedaf"});
}
let displayFrame=null, spareBuffer=null, scopePending=false, lastDraw=-Infinity;
let labelAlgorithm=-1, lastNoteLabel="", scopeDirty=true;
function receiveScope(event) {
  const m=event.data;
  if(m.type!=="scope")return;
  // The previous frame stays readable while the next buffer is on the audio thread.
  if(displayFrame)spareBuffer=displayFrame.data.buffer;
  displayFrame={data:new Float32Array(m.buffer),note:m.note,algorithm:m.algorithm};
  scopePending=false;scopeDirty=true;
}
function updateScopeLabels(algorithm,note) {
  const sounding=algorithm!==0;
  const label=sounding?"表示音 "+names[note%12]+(Math.floor(note/12)-1):"表示音 —";
  if(label!==lastNoteLabel){$("scope-note").textContent=label;lastNoteLabel=label}
  const shown=sounding?algorithm:patch.algorithm;
  if(labelAlgorithm===shown)return;
  labelAlgorithm=shown;scopeDirty=true;
  const carriers=route(shown).carriers;
  for(let op=0;op<OPS;op++) {
    const carrier=carriers.includes(op),trace=traces[op];
    trace.kind.textContent=carrier?"キャリア":"モジュレーター";
    trace.figure.classList.toggle("modulator",!carrier);
    trace.color=carrier?"#cee79b":"#f1b486";
  }

}
// Choose one rising zero crossing for all nine traces, so their relative
// phases and time positions remain comparable. A muted master uses an OP.
// Each sample row holds OP1–OP8 and then the master output.
const STRIDE=OPS+1;
function trigger(data,visible) {
  if(!data)return 0;
  const limit=data.length/STRIDE-visible;
  let channel=OPS,largest=0;
  for(let op=OPS;op>=0;op--){
    let peak=0;
    for(let i=0;i<=limit;i++)peak=Math.max(peak,Math.abs(data[i*STRIDE+op]));
    if(peak>largest){largest=peak;channel=op}
    if(op===OPS && peak>0.002)break;
  }
  for(let i=1;i<=limit;i++){
    if(data[(i-1)*STRIDE+channel]<=0 && data[i*STRIDE+channel]>0)return i;
  }
  return 0;
}
function paintTrace(trace,channel,data,start,count,zoom) {
  const {canvas,g}=trace;
  const dpr=Math.min(devicePixelRatio,2);
  const w=Math.max(1,Math.round(canvas.clientWidth*dpr)),h=Math.max(1,Math.round(canvas.clientHeight*dpr));
  if(canvas.width!==w)canvas.width=w;if(canvas.height!==h)canvas.height=h;
  g.clearRect(0,0,w,h);g.strokeStyle="#40594d";g.lineWidth=dpr*.65;g.beginPath();
  for(let k=1;k<6;k++){const x=w*k/6;g.moveTo(x,0);g.lineTo(x,h)}
  for(let k=1;k<4;k++){const y=h*k/4;g.moveTo(0,y);g.lineTo(w,y)}
  g.stroke();g.strokeStyle=trace.color;g.lineWidth=1.35*dpr;g.beginPath();
  if(!data){g.moveTo(0,h/2);g.lineTo(w,h/2)}
  else for(let i=0;i<count;i++){
    const value=data[(start+i)*STRIDE+channel];
    const x=w*i/(count-1),y=h*(.5-.48*value*zoom);
    if(i===0)g.moveTo(x,y);else g.lineTo(x,y);
  }
  g.stroke();
}
function draw(now=0) {
  const algorithm=displayFrame?.algorithm??0;
  updateScopeLabels(algorithm,displayFrame?.note??0);
  if(now-lastDraw>=1000/30){
    const visible=Math.max(2,Math.round((ctx?.sampleRate??48000)*.012));
    if(scopeDirty){
      const data=displayFrame?.data,start=trigger(data,visible),zoom=Number($("scope-zoom").value)||1;
      traces.forEach((trace,channel)=>paintTrace(trace,channel,data,start,visible,zoom));
      scopeDirty=false;
    }
    if(node && !scopePending && ctx.state==="running" && !document.hidden){
      const buffer=spareBuffer??new ArrayBuffer(visible*2*STRIDE*4);
      spareBuffer=null;scopePending=true;
      node.port.postMessage({type:"scope",buffer},[buffer]);
    }
    lastDraw=now;
  }
  requestAnimationFrame(draw);
}
$("scope-zoom").onchange=e=>{scopeDirty=true;e.target.blur()};
window.addEventListener("resize",()=>{scopeDirty=true;drawRouting(route(patch.algorithm))});
setOct(4);loadPatch(BANK[0],0);draw();
